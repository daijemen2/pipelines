name: HTML to PDF

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to convert to PDF'
        required: true
      output:
        description: 'Output PDF path'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: fifsky/html-to-pdf-action@v1
        with:
          url: ${{ github.event.inputs.url }}
          output: ${{ github.event.inputs.output }}
