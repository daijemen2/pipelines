name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '04'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '14'

env:
  LANGUAGE: ${{ vars.LANG }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_data: ${{ steps.set-matrix.outputs.has_data }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Restore API cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache/api_response.json
          key: api-cache-${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          echo "Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json and set outputs
        id: set-matrix
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          MATRIX="[]"

          if jq -e '.selected != null' cache/api_response.json > /dev/null; then
            MATRIX=$(jq --arg month "$MONTH" --arg day "$DAY" '
              [.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
                {
                  title: .title,
                  url: .content_urls.desktop.page,
                  filename: ($month + "-" + $day + "-" + (.title | gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")
                }
              ]
            ' cache/api_response.json)
          fi

          echo "$MATRIX" > cache/matrix.json

          LENGTH=$(jq 'length' cache/matrix.json)

          if [ "$LENGTH" -eq 0 ]; then
            echo "has_data=false" >> $GITHUB_OUTPUT
            echo 'matrix=[]' >> $GITHUB_OUTPUT
          else
            echo "has_data=true" >> $GITHUB_OUTPUT
            MATRIX_ESCAPED=$(jq -c . cache/matrix.json)
            echo "matrix=$MATRIX_ESCAPED" >> $GITHUB_OUTPUT
          fi

  generate_pdfs:
    needs: fetch_events
    if: needs.fetch_events.outputs.has_data == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Convert HTML to PDF
        uses: narthanaj/html-to-pdf-action@main
        with:
          source: ${{ matrix.url }}
          output: pdfs/${{ matrix.filename }}
          format: A4
          orientation: portrait
          print_background: true

      - name: Upload PDFs (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: partial-pdfs
          path: pdfs/*
          retention-days: 1

  package_pdfs:
    needs: generate_pdfs
    runs-on: ubuntu-latest
    steps:
      - name: Download all partial PDFs
        uses: actions/download-artifact@v4
        with:
          name: partial-pdfs
          path: pdfs

      - name: Create ZIP with all PDFs
        run: |
          zip -j all-pdfs.zip pdfs/*.pdf

      - name: Upload single ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-pdfs
          path: all-pdfs.zip
          retention-days: 1
