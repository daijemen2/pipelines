name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${{ github.event.inputs.month }}/${{ github.event.inputs.day }}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix
        id: set-matrix
        run: |
          jq -c --arg month "${{ github.event.inputs.month }}" --arg day "${{ github.event.inputs.day }}" '
            .selected | map({
              title: (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")),
              url: .pages[0].content_urls.desktop.page,
              filename: ($month + "-" + $day + "-" + (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")) + ".pdf")
            })
          ' cache/api_response.json > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Generate PDF
        uses: narthanaj/html-to-pdf-action@v1.0.0
        with:
          source: ${{ matrix.url }}
          output: pdfs/${{ matrix.filename }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
