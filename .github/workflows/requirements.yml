name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_data: ${{ steps.set-matrix.outputs.has_data }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json and set outputs
        id: set-matrix
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          MATRIX=$(jq --arg month "$MONTH" --arg day "$DAY" '
            [.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
              {
                title: .title,
                url: .content_urls.desktop.page,
                filename: ($month + "-" + $day + "-" + (.title | gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")
              }
            ]
          ' cache/api_response.json)

          echo "$MATRIX" > cache/matrix.json

          echo "🔍 DEBUG: Contenido de matrix.json"
          cat cache/matrix.json

          LENGTH=$(jq 'length' cache/matrix.json)

          if [ "$LENGTH" -eq 0 ]; then
            echo "has_data=false" >> $GITHUB_OUTPUT
            echo 'matrix=[]' >> $GITHUB_OUTPUT
            echo "⚠️ DEBUG: No se encontraron eventos. matrix=[]"
          else
            echo "has_data=true" >> $GITHUB_OUTPUT
            MATRIX_ESCAPED=$(jq -c . cache/matrix.json)
            echo "matrix=$MATRIX_ESCAPED" >> $GITHUB_OUTPUT
            echo "✅ DEBUG: matrix=$MATRIX_ESCAPED"
          fi

  prepare_matrix:
    needs: fetch_events
    if: needs.fetch_events.outputs.has_data == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pass.outputs.matrix }}
    steps:
      - name: Pasar matrix al siguiente job
        id: pass
        run: |
          echo "matrix=${{ needs.fetch_events.outputs.matrix }}" >> $GITHUB_OUTPUT
          echo "✅ DEBUG: matrix recibido en prepare_matrix: ${{ needs.fetch_events.outputs.matrix }}"

  generate_pdfs:
    needs: prepare_matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Download HTML content
        run: |
          curl -s "${{ matrix.url }}" -o index.html

      - name: Generate PDF
        uses: arthur-jaouen/html2pdf-action@v1
        with:
          inputPath: './index.html'
          outputPath: './pdfs/${{ matrix.filename }}'
          pdfOptions: '{"format": "A4", "printBackground": true, "preferCSSPageSize": true}'

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
