name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (01-12)'
        required: true
        default: '01'
      day:
        description: 'Day (01-31)'
        required: true
        default: '01'

jobs:
  fetch-and-generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Call On This Day API
        run: |
          curl -s "https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/events/${{ github.event.inputs.month }}/${{ github.event.inputs.day }}" \
          -H "accept: application/json" > response.json

      - name: Build matrix from response.json
        id: build-matrix
        run: |
          # Extraer todas las URLs de los eventos
          urls=$(jq -r '.selected[]?.pages[0]?.content_urls?.desktop?.page // empty' response.json)

          if [ -z "$urls" ]; then
            echo "No se encontraron URLs en el JSON"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          arr=()
          i=1
          for url in $urls; do
            filename="event_$i.pdf"
            arr+=("{\"url\":\"$url\",\"filename\":\"$filename\"}")
            i=$((i+1))
          done

          # Convertir a JSON array
          matrix=$(printf '%s\n' "${arr[@]}" | jq -s .)

          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
