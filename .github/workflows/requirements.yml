name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API (hardcoded date)
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix
        id: set-matrix
        run: |
          matrix=$(jq -c '[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: ("07-01-" + (.title|gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")}]' cache/api_response.json)
          
          # Usamos EOF para manejar JSON con comillas y caracteres especiales
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDF
        uses: chromium-actions/html-to-pdf-action@v2
        with:
          url: ${{ matrix.url }}
          outputPath: pdfs/${{ matrix.filename }}

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
