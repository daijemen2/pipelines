name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Mes en formato MM'
        required: true
        default: '07'
      day:
        description: 'Día en formato DD'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix-file: ${{ steps.prepare-matrix.outputs.matrix-file }}
    steps:
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Llamar a On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validar respuesta de la API
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Preparar matrix JSON
        id: prepare-matrix
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          MATRIX=$(jq -c '[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: ("'"$MONTH-$DAY-"'"+(.title|gsub("[^A-Za-z0-9_]"; "_"))+".pdf")} ]' cache/api_response.json)
          echo "$MATRIX" > cache/matrix.json
          echo "matrix-file=cache/matrix.json" >> $GITHUB_OUTPUT

      - name: Subir matrix JSON
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Descargar matrix JSON
        uses: actions/download-artifact@v4
        with:
          name: matrix

      - name: Instalar jq y Node.js
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Generar PDFs con Marketplace Action
        run: |
          mkdir -p pdfs
          # Crear lista de URLs separadas por coma
          URLS=$(jq -r '[.[] | .url] | join(",")' cache/matrix.json)
          echo "URLs: $URLS"
          # Ejecutar Action de Marketplace para HTML → PDF
          npx devops-infra/action-html2pdf@v2 --urls "$URLS" --output-dir pdfs --format A4

      - name: Subir PDFs generados
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
