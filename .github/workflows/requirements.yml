name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master

jobs:
  call_on_this_day_api:
    name: Call On This Day API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set environment variables based on branch
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "Running on master branch"
            ENVIRONMENT="production"
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "Running on staging branch"
            ENVIRONMENT="staging"
          elif [[ "${{ github.ref_name }}" == feature/* ]]; then
            echo "Running on feature branch"
            ENVIRONMENT="development"
          else
            echo "Unknown branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

      - name: Call On This Day API
        run: |
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "API Response: $RESPONSE"

          # Save the response to a file
          echo "$RESPONSE" > api_response.json

          # Display the file content for inspection
          echo "Saved API response to api_response.json"
          cat api_response.json

      - name: Deploy or log based on environment
        run: |
          if [[ "$ENVIRONMENT" == "production" ]]; then
            echo "Deploying to production environment"
            # Add production deployment steps here
          elif [[ "$ENVIRONMENT" == "staging" ]]; then
            echo "Deploying to staging environment"
            # Add staging deployment steps here
          elif [[ "$ENVIRONMENT" == "development" ]]; then
            echo "Running in development environment"
            # Add development-specific steps here
          fi