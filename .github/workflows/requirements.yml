name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix-file: cache/matrix.json
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix.json
        run: |
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${MONTH}-${DAY}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          cat cache/matrix.json

      - name: Upload matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix.json
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: cache

      - name: Create PDFs folder
        run: mkdir -p pdfs

      # Este step generará los PDFs uno por uno usando el Action de Marketplace
      - name: Generate PDFs using HTML-to-PDF Action
        uses: LukaszLapaj/html-to-pdf-action@master
        with:
          # json con lista de PDFs a generar
          pdfs: |
            $(
              count=$(jq 'length' cache/matrix.json)
              if [ "$count" -eq 0 ]; then
                echo "[]"
              else
                jq -c '.[] | {htmlFile: .url, outputFile: ("pdfs/"+.filename), pdfOptions: {"format":"A4","margin":{"top":"10mm","left":"10mm","right":"10mm","bottom":"10mm"}}}' cache/matrix.json | jq -s '.'
              fi
            )

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
