name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (01-12)'
        required: true
        default: '01'
      day:
        description: 'Day (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_and_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Set month and day
        run: |
          echo "MONTH=${{ github.event.inputs.month }}" >> $GITHUB_ENV
          echo "DAY=${{ github.event.inputs.day }}" >> $GITHUB_ENV

      - name: Fetch events from API
        run: |
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL" > api_response.json

      - name: Prepare event list
        run: |
          mkdir -p pdfs
          jq -c '.selected[]? | {title: .pages[0].title, url: .pages[0].content_urls.desktop.page}' api_response.json > events/list.json

      # ✅ Generar PDFs usando Action de Marketplace correctamente
      - name: Generate PDFs from URLs
        uses: wei/html-to-pdf-action@v1
        with:
          urls-file: events/list.json      # Pasamos el JSON con "url" y "title"
          output-folder: pdfs
          filename-template: '${{ env.MONTH }}-${{ env.DAY }}-${title}.pdf' # title se toma de cada objeto

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
