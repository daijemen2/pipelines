name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '20'

env:
  LANGUAGE: es

jobs:
  fetch_and_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          echo "Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        run: |
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          echo "Matrix content:"
          cat cache/matrix.json

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs using Marketplace Action
        run: |
          jq -c '.[]' cache/matrix.json | while read item; do
            title=$(echo "$item" | jq -r '.title')
            url=$(echo "$item" | jq -r '.url')
            filename=$(echo "$item" | jq -r '.filename')

            echo "Generating PDF for: $title"
            echo "URL: $url"
            echo "Filename: $filename"

            echo "source=$url" >> $GITHUB_ENV
            echo "output=pdfs/$filename" >> $GITHUB_ENV

            gh workflow run .github/workflows/_convert.yml -f source="$url" output="pdfs/$filename"
          done
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
