name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API (hardcoded date)
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix
        id: set-matrix
        run: |
          jq -c '
            .selected | map({
              title: (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")),
              url: .pages[0].content_urls.desktop.page,
              filename: ("07-01-" + (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")) + ".pdf")
            })
          ' cache/api_response.json > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Generate PDF
        uses: narthanaj/html-to-pdf-action@v1.0.0
        with:
          source: ${{ matrix.url }}
          output: pdfs/${{ matrix.filename }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
