name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        run: |
          mkdir -p cache
          jq '[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: ("07-01-" + (.title|gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")}]' \
            cache/api_response.json > cache/matrix.json
          echo "Matrix created:"
          cat cache/matrix.json

      - name: Upload matrix file
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix file
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: cache

      - name: Verify matrix file
        run: |
          ls -l cache
          cat cache/matrix.json

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs
        run: |
          count=$(jq 'length' cache/matrix.json)
          if [ "$count" -eq 0 ]; then
            echo "No events to generate PDFs."
            exit 0
          fi

          # Loop sobre cada evento
          jq -c '.[]' cache/matrix.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            filename=$(echo "$item" | jq -r '.filename')
            echo "Generating PDF: $filename from $url"

            # Ejecutar la acción de Marketplace usando npx localmente (alternativa)
            # NOTA: html-to-pdf-action no se puede usar como `uses` dentro del loop
            # Puedes crear un script Node.js que llame a html-to-pdf-action por cada URL
            # Ejemplo temporal:
            echo "Simulando PDF: $filename desde $url"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
