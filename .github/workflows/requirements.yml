name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix.json
        id: set-matrix
        run: |
          matrix=$(jq -c '[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: ("07-01-" + (.title|gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")}]' \
            cache/api_response.json)
          
          # Si no hay eventos, se deja un array vacío para evitar errores
          if [ "$matrix" == "null" ] || [ "$matrix" == "[]" ]; then
            matrix="[]"
          fi

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "Matrix content:"
          echo $matrix

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDF
        uses: chromium-actions/html-to-pdf-action@v2
        with:
          url: ${{ matrix.url }}
          outputPath: pdfs/${{ matrix.filename }}

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
