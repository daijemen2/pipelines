name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  generate_pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL" > cache/api_response.json
      - name: Prepare PDFs directory
        run: mkdir -p pdfs

      - name: Generate PDFs using html-to-pdf-action
        run: |
          curl -sSL https://github.com/narthanaj/html-to-pdf-action/releases/latest/download/html-to-pdf-linux \
            -o html-to-pdf && chmod +x html-to-pdf

          jq -c '.selected[]' cache/api_response.json | while read -r event; do
            TITLE=$(echo "$event" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$event" | jq -r '.pages[0].content_urls.desktop.page')
            FILENAME="pdfs/${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${TITLE}.pdf"
            echo "Generating PDF for: $TITLE"
            ./html-to-pdf "$URL" "$FILENAME"
          done

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
