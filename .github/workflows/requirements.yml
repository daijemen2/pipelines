name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month (MM format)"
        required: true
        default: "01"
      day:
        description: "Day (DD format)"
        required: true
        default: "01"

jobs:
  get-events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Call On This Day API
        id: api
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          URL="https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/events/$MONTH/$DAY"
          echo "Calling $URL"
          curl -s "$URL" > response.json
          cat response.json

      - name: Extract Events and Prepare Matrix
        id: set-matrix
        run: |
          urls=$(jq -r '.selected[].pages[0].content_urls.desktop.page' response.json)
          filenames=()
          arr=()
          i=1
          for url in $urls; do
            filename="event_$i.pdf"
            arr+=("{\"url\":\"$url\",\"filename\":\"$filename\"}")
            i=$((i+1))
          done
          matrix=$(printf '%s\n' "${arr[@]}" | jq -s .)
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  convert-to-pdf:
    needs: get-events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.get-events.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert HTML to PDF
        uses: narthanaj/html-to-pdf-action@main
        with:
          source: ${{ matrix.url }}
          output: pdfs/${{ matrix.filename }}
          format: A4
          orientation: portrait
          print_background: true

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: pdfs/${{ matrix.filename }}
          retention-days: 1
