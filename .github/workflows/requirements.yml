name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix-json: ${{ steps.prepare-matrix.outputs.matrix-json }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        id: call-api
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month || '07' }}"
          DAY="${{ github.event.inputs.day || '01' }}"
          echo "Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        id: prepare-matrix
        run: |
          mkdir -p cache
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${MONTH}-${DAY}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          cat cache/matrix.json
          echo "::set-output name=matrix-json::$(cat cache/matrix.json | jq -c .)"

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        event: ${{fromJson(needs.fetch_events.outputs.matrix-json)}}
    steps:
      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDF for event
        uses: LukaszLapaj/html-to-pdf-action@master
        with:
          htmlFile: ${{ matrix.event.url }}
          outputFile: pdfs/${{ matrix.event.filename }}
          pdfOptions: '{"format": "A4", "margin": {"top": "10mm","left":"10mm","right":"10mm","bottom":"10mm"}}'

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
