name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix-json }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month || '07' }}"
          DAY="${{ github.event.inputs.day || '01' }}"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        id: set-matrix
        run: |
          mkdir -p cache
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${MONTH}-${DAY}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          echo "::set-output name=matrix-json::$(cat cache/matrix.json | jq -c .)"

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.fetch_events.outputs.matrix)}}
    steps:
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Download HTML
        run: curl -s "${{ matrix.url }}" -o "pdfs/${{ matrix.filename }}.html"

      - name: Generate PDF
        uses: arthur-jaouen/html2pdf-action@v1
        with:
          inputPath: "pdfs/${{ matrix.filename }}.html"
          outputPath: "pdfs/${{ matrix.filename }}"
          pdfOptions: '{"format": "A4", "printBackground": true, "preferCSSPageSize": true}'

      - name: Clean temporary HTML
        run: rm "pdfs/${{ matrix.filename }}.html"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
