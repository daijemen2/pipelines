name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  generate_pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > cache/api_response.json

      - name: Prepare PDFs directory
        run: mkdir -p pdfs

      - name: Generate PDFs using Marketplace Action
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const data = JSON.parse(fs.readFileSync('cache/api_response.json', 'utf-8'));
            fs.mkdirSync('pdfs', { recursive: true });

            for (const event of data.selected) {
              const page = event.pages?.[0];
              if (!page) continue;

              const title = page.title.replace(/[^A-Za-z0-9_-]/g, '_');
              const url = page.content_urls.desktop.page;
              const filename = `pdfs/${process.env.MONTH}-${process.env.DAY}-${title}.pdf`;

              console.log(`Generating PDF for: ${title}`);
              execSync(`npx html-to-pdf-cli "${url}" "${filename}"`);
            }
        env:
          MONTH: ${{ github.event.inputs.month }}
          DAY: ${{ github.event.inputs.day }}

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
