name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format'
        required: true
        default: '07'
      day:
        description: 'Day in DD format'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix-file: matrix.json
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
          "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${{ github.event.inputs.month }}/${{ github.event.inputs.day }}" \
          > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix and save to file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const month = '${{ github.event.inputs.month }}';
            const day = '${{ github.event.inputs.day }}';
            const data = JSON.parse(fs.readFileSync('cache/api_response.json', 'utf8'));
            const matrix = (data.selected || []).map(event => {
              const page = event.pages?.[0];
              if (!page || !page.content_urls?.desktop?.page) return null;
              const title = page.title.replace(/[^A-Za-z0-9_-]/g, '_');
              const url = page.content_urls.desktop.page;
              const filename = `${month}-${day}-${title}.pdf`;
              return { title, url, filename };
            }).filter(Boolean);
            fs.writeFileSync('matrix.json', JSON.stringify(matrix, null, 2));

      - name: Upload matrix file
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix file
        uses: actions/download-artifact@v4
        with:
          name: matrix

      - name: Check matrix
        run: |
          COUNT=$(jq 'length' matrix.json)
          echo "Found $COUNT events"
          if [ "$COUNT" -eq 0 ]; then
            echo "No events to generate PDFs. Exiting."
            exit 0
          fi

      # ✅ Acción de Marketplace HTML to PDF
      - name: Generate PDFs using Marketplace Action
        uses: devops-infra/action-html2pdf@v2
        with:
          urls: |
            ${{ toJson(fromJson(needs.fetch_events.outputs['matrix-file']) | map(.url)) }}
          output-dir: pdfs
          format: A4

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
