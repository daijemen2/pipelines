name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    name: Fetch events from API
    runs-on: ubuntu-latest
    outputs:
      events_array: ${{ steps.prepare.outputs.events_array }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Prepare events for matrix
        id: prepare
        run: |
          EVENTS=$(jq -c '.selected[]?' api_response.json | jq -s .)
          if [ "$EVENTS" = "[]" ] || [ -z "$EVENTS" ]; then
            echo "No events found for this date, setting empty array"
            EVENTS="[]"
          fi
          echo "events_array<<EOF" >> $GITHUB_OUTPUT
          echo "$EVENTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    if: needs.fetch_events.outputs.events_array != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        event: ${{ fromJSON(needs.fetch_events.outputs.events_array) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf jq

      - name: Generate PDF from URL
        run: |
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          # Limpiar título para nombre de archivo seguro
          TITLE=$(echo '${{ matrix.event }}' | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
          URL=$(echo '${{ matrix.event }}' | jq -r '.pages[0].content_urls.desktop.page')
          mkdir -p pdfs
          OUTPUT="pdfs/${MONTH}-${DAY}-${TITLE}.pdf"
          echo "Generating $OUTPUT from $URL"
          wkhtmltopdf --quiet "$URL" "$OUTPUT"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
