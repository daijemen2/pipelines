name: Operaciones Matematicas

on:
  workflow_dispatch:
    inputs:
      numero1:
        description: 'Primer numero'
        required: true
      numero2:
        description: 'Segundo numero'
        required: true

jobs:
  suma:
    name: Suma
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Suma
        run: |
          num1=${{ github.event.inputs.numero1 }}
          num2=${{ github.event.inputs.numero2 }}
          resultado=$((num1 + num2))
          echo "Suma: $resultado"

  resta:
    name: Resta
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Resta
        run: |
          num1=${{ github.event.inputs.numero1 }}
          num2=${{ github.event.inputs.numero2 }}
          resultado=$((num1 - num2))
          echo "Resta: $resultado"

  multiplicacion:
    name: Multiplicacion
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Multiplicacion
        run: |
          num1=${{ github.event.inputs.numero1 }}
          num2=${{ github.event.inputs.numero2 }}
          resultado=$((num1 * num2))
          echo "Multiplicacion: $resultado"

  division:
    name: Division
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ejecutar Division
        run: |
          num1=${{ github.event.inputs.numero1 }}
          num2=${{ github.event.inputs.numero2 }}
          if [ "$num2" -eq 0 ]; then
            echo "Error: Division entre cero no permitida"
            exit 1
          fi
          resultado=$(echo "scale=2; $num1 / $num2" | bc)
          echo "Division: $resultado"