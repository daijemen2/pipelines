name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          echo "Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        run: |
          mkdir -p cache
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          echo "Matrix content:"
          cat cache/matrix.json

      - name: Upload matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix.json
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: cache

      - name: Install Node & Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          npm install puppeteer

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs
        run: |
          count=$(jq 'length' cache/matrix.json)
          if [ "$count" -eq 0 ]; then
            echo "No events to generate PDFs."
            exit 0
          fi

          node -e "
          const fs = require('fs');
          const puppeteer = require('puppeteer');
          const matrix = JSON.parse(fs.readFileSync('cache/matrix.json', 'utf8'));
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            for (const item of matrix) {
              console.log('Generating PDF:', item.filename);
              const page = await browser.newPage();
              await page.goto(item.url, { waitUntil: 'networkidle0' });
              await page.pdf({ path: 'pdfs/' + item.filename, format: 'A4' });
            }
            await browser.close();
          })();
          "

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
