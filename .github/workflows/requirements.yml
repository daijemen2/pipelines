name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_and_generate:
    name: Fetch events and generate PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Set month and day defaults
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$MONTH" ]; then MONTH="01"; fi
          if [ -z "$DAY" ]; then DAY="01"; fi
          echo "MONTH=$MONTH" >> $GITHUB_ENV
          echo "DAY=$DAY" >> $GITHUB_ENV
          echo "Using MONTH=$MONTH and DAY=$DAY"

      - name: Call On This Day API
        run: |
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Prepare events array
        id: prepare
        run: |
          EVENTS=$(jq -c '.selected[]?' api_response.json | jq -s .)
          if [ -z "$EVENTS" ] || [ "$EVENTS" = "[]" ]; then
            echo "No events found for this date, setting empty array"
            EVENTS="[]"
          fi
          # Guardar en Base64 para manejar multilinea
          echo "$EVENTS" | base64 > events_base64.txt

      - name: Generate PDFs using Marketplace Action
        run: |
          EVENTS=$(cat events_base64.txt | base64 --decode)
          mkdir -p pdfs
          for row in $(echo "$EVENTS" | jq -c '.[]'); do
            TITLE=$(echo "$row" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$row" | jq -r '.pages[0].content_urls.desktop.page')
            OUTPUT="pdfs/${MONTH}-${DAY}-${TITLE}.pdf"
            echo "Generating $OUTPUT from $URL"
            # Usando Action de Marketplace a nivel de Bash
            npx wkhtmltopdf "$URL" "$OUTPUT"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
