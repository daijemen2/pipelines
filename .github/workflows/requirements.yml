name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (01-12)'
        required: true
        default: '01'
      day:
        description: 'Day (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      events_matrix: ${{ steps.set_matrix.outputs.matrix_json }}
      events_length: ${{ steps.set_matrix.outputs.events_length }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Fetch events from API
        id: fetch
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL" > api_response.json

      - name: Create matrix for parallel PDF generation
        id: set_matrix
        run: |
          EVENTS=$(jq -c '.selected[]? | {title: .pages[0].title, url: .pages[0].content_urls.desktop.page}' api_response.json)
          if [ -z "$EVENTS" ]; then
            echo "No events found"
            echo "matrix_json=[]" >> $GITHUB_OUTPUT
            echo "events_length=0" >> $GITHUB_OUTPUT
          else
            MATRIX=$(echo "$EVENTS" | jq -s '.')
            LENGTH=$(echo "$MATRIX" | jq 'length')
            echo "matrix_json=$MATRIX" >> $GITHUB_OUTPUT
            echo "events_length=$LENGTH" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    if: ${{ needs.fetch_events.outputs.events_length != '0' }}
    strategy:
      matrix:
        event: ${{ fromJSON(needs.fetch_events.outputs.events_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set TITLE and URL
        run: |
          TITLE=$(echo '${{ matrix.event }}' | jq -r '.title' | sed 's/[^A-Za-z0-9_-]/_/g')
          URL=$(echo '${{ matrix.event }}' | jq -r '.url')
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "URL=$URL" >> $GITHUB_ENV

      - name: Create pdfs folder
        run: mkdir -p pdfs

      - name: Generate PDF using Marketplace Action
        uses: fifsky/html-to-pdf-action@master
        with:
          url: ${{ env.URL }}
          outputFile: pdfs/${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${{ env.TITLE }}.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
