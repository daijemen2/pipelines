name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    name: Fetch events from API
    runs-on: ubuntu-latest
    outputs:
      events_array: ${{ steps.prepare.outputs.events_array }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Prepare events for matrix
        id: prepare
        run: |
          EVENTS=$(jq -c '.selected[]?' api_response.json | jq -s .)
          echo "events_array=$EVENTS" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        event: ${{ fromJSON(needs.fetch_events.outputs.events_array) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create PDF folder
        run: mkdir -p pdfs

      - name: Generate PDF from URL (Marketplace Action)
        uses: crazy-max/ghaction-wkhtmltopdf@v1
        with:
          urls: ${{ matrix.event.pages[0].content_urls.desktop.page }}
          output: pdfs/${{ github.event.inputs.month || '01' }}-${{ github.event.inputs.day || '01' }}-${{ matrix.event.pages[0].title | replace(' ','_') }}.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
