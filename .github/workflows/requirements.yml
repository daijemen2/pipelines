name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  call_on_this_day_api:
    name: Call On This Day API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies (curl, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > cache/api_response.json

      - name: Generate PDFs with frostmark/action-pdf
        run: |
          mkdir -p pdfs
          jq -c '.selected[]' cache/api_response.json | while read -r event; do
            TITLE=$(echo "$event" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$event" | jq -r '.pages[0].content_urls.desktop.page')
            echo "Processing: $TITLE -> $URL"

            # Ejecutar el Action de marketplace en cada iteración
            echo "name: Generate PDF $TITLE" > temp-action.yml
            echo "on: workflow_dispatch" >> temp-action.yml
            echo "jobs:" >> temp-action.yml
            echo "  pdf_job:" >> temp-action.yml
            echo "    runs-on: ubuntu-latest" >> temp-action.yml
            echo "    steps:" >> temp-action.yml
            echo "      - name: Convert URL to PDF" >> temp-action.yml
            echo "        uses: frostmark/action-pdf@v1" >> temp-action.yml
            echo "        with:" >> temp-action.yml
            echo "          url: \"$URL\"" >> temp-action.yml
            echo "          outputFile: \"pdfs/${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${TITLE}.pdf\"" >> temp-action.yml
          done

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
