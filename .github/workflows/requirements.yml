name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  generate_pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        id: call_api
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          mkdir -p cache pdfs
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare events
        id: prepare_events
        run: |
          # Usamos // [] para manejar casos donde .selected es null
          jq -c '[.selected // [] | .[] | .pages[0] | select(.content_urls.desktop.page != null) |
              {title: .title, url: .content_urls.desktop.page, filename: ("'"$MONTH-$DAY-"'"+(.title|gsub("[^A-Za-z0-9_]"; "_"))+".pdf")}]' \
              cache/api_response.json > cache/matrix.json

          count=$(jq 'length' cache/matrix.json)
          echo "Found $count events"
          if [ "$count" -eq 0 ]; then
            echo "No events found, skipping PDF generation."
            exit 0
          fi

      - name: Generate PDFs
        run: |
          for row in $(jq -c '.[]' cache/matrix.json); do
            url=$(echo "$row" | jq -r '.url')
            file=$(echo "$row" | jq -r '.filename')
            echo "Generating PDF $file from $url"
            npx html2pdf-action --path "$url" --output "pdfs/$file" --options '{"format":"A4"}'
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
