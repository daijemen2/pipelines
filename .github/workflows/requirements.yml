name: Operaciones Matemáticas Básicas

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      numero1:
        description: 'Primer número'
        required: true
      numero2:
        description: 'Segundo número'
        required: true

jobs:
  suma:
    name: Suma
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Suma
        run: |
          num1=${{ github.event.inputs.numero1 || 10 }}
          num2=${{ github.event.inputs.numero2 || 2 }}
          resultado=$((num1 + num2))
          echo "Suma: $resultado"

  resta:
    name: Resta
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Resta
        run: |
          num1=${{ github.event.inputs.numero1 || 10 }}
          num2=${{ github.event.inputs.numero2 || 2 }}
          resultado=$((num1 - num2))
          echo "Resta: $resultado"

  multiplicacion:
    name: Multiplicación
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Multiplicación
        run: |
          num1=${{ github.event.inputs.numero1 || 10 }}
          num2=${{ github.event.inputs.numero2 || 2 }}
          resultado=$((num1 * num2))
          echo "Multiplicación: $resultado"

  division:
    name: División
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ejecutar División
        run: |
          num1=${{ github.event.inputs.numero1 || 10 }}
          num2=${{ github.event.inputs.numero2 || 2 }}
          if [ "$num2" -eq 0 ]; then
            echo "Error: División entre cero no permitida"
            exit 1
          fi
          resultado=$(echo "scale=2; $num1 / $num2" | bc)
          echo "División: $resultado"
