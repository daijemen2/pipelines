name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL" > cache/api_response.json

      - name: Prepare matrix
        id: set-matrix
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          jq -c '.selected[]' cache/api_response.json | jq -s --arg month "$MONTH" --arg day "$DAY" '
            map({
              title: (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")),
              url: .pages[0].content_urls.desktop.page,
              filename: ($month + "-" + $day + "-" + (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")) + ".pdf")
            })
          ' > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch_events.outputs.matrix) }}
    steps:
      - name: Generate PDF
        uses: narthanaj/html-to-pdf-action@v1
        with:
          source: ${{ matrix.url }}
          output: pdfs/${{ matrix.filename }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
