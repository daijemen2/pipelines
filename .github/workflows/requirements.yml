name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  call_on_this_day_api:
    name: Call On This Day API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > cache/api_response.json

      - name: Extract URLs and Titles
        id: extract
        run: |
          mkdir -p urls
          jq -c '.selected[]' cache/api_response.json | while read -r event; do
            TITLE=$(echo "$event" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$event" | jq -r '.pages[0].content_urls.desktop.page')
            FILENAME="${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${TITLE}.pdf"
            echo "$URL|$FILENAME" >> urls/list.txt
          done

      - name: Generate PDFs using Marketplace Action
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const urls = fs.readFileSync('urls/list.txt', 'utf-8').trim().split('\n');
            const jobs = urls.map((line, index) => {
              const [url, filename] = line.split('|');
              return {
                jobId: `pdf_job_${index}`,
                uses: 'narthanaj/html-to-pdf-action@v1',
                with: {
                  source: url,
                  output: `pdfs/${filename}`
                }
              };
            });
            return jobs;

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
