name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  call_on_this_day_api:
    name: Call On This Day API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies (curl, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > cache/api_response.json

      - name: Download HTML and Convert to PDF
        run: |
          mkdir -p pdfs htmls
          jq -c '.selected[]' cache/api_response.json | while read -r event; do
            TITLE=$(echo "$event" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$event" | jq -r '.pages[0].content_urls.desktop.page')
            echo "Downloading HTML for: $TITLE -> $URL"
            curl -s "$URL" -o "htmls/${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${TITLE}.html"
          done

      - name: Convert all HTMLs to PDFs
        uses: LukaszLapaj/html-to-pdf-action@master
        with:
          htmlFile: htmls
          outputFile: pdfs
          pdfOptions: '{"format": "A4", "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfsaction pdf