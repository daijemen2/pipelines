name: On This Day API Test Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  test_on_this_day:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API (hardcoded date)
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Extract first event info
        id: extract
        run: |
          TITLE=$(jq -r '.selected[0].pages[0].title' cache/api_response.json | sed 's/[^A-Za-z0-9_-]/_/g')
          URL=$(jq -r '.selected[0].pages[0].content_urls.desktop.page' cache/api_response.json)
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Generate PDF
        uses: narthanaj/html-to-pdf-action@v1
        with:
          source: ${{ steps.extract.outputs.url }}
          output: pdfs/07-01-${{ steps.extract.outputs.title }}.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdf
          path: pdfs
