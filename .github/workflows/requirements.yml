name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format'
        required: true
        default: '07'
      day:
        description: 'Day in DD format'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  generate_pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        id: call_api
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          mkdir -p cache pdfs
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare events list
        id: prepare_list
        run: |
          jq -c '[.selected // [] | .[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title,
             url: .content_urls.desktop.page,
             filename: ("'"${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-"'"+(.title|gsub("[^A-Za-z0-9_]"; "_"))+".pdf")}]' \
            cache/api_response.json > cache/matrix.json

          COUNT=$(jq 'length' cache/matrix.json)
          echo "Found $COUNT events"
          if [ "$COUNT" -eq 0 ]; then
            echo "No events found, skipping PDF generation."
            exit 0
          fi

      - name: Generate PDFs using Marketplace Action
        uses: devops-infra/action-html2pdf@v2
        with:
          input: cache/matrix.json
          output-dir: pdfs
          filename-key: filename
          url-key: url
          options: '{"format":"A4"}'

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
