name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq nodejs npm

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MONTH="${{ github.event.inputs.month }}"
            DAY="${{ github.event.inputs.day }}"
          else
            MONTH="07"
            DAY="01"
          fi

          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Prepare matrix.json
        run: |
          mkdir -p cache
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"$MONTH-$DAY-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          echo "Matrix content:"
          cat cache/matrix.json

      - name: Upload matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: cache

      - name: Install Marketplace Action dependencies
        run: npm install chromium-actions/html-to-pdf-action@v2

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs using Marketplace Action from Node
        run: |
          node -e "
          const { execSync } = require('child_process');
          const fs = require('fs');
          const matrix = JSON.parse(fs.readFileSync('cache/matrix.json', 'utf8'));
          if(matrix.length === 0) { console.log('No events to generate PDFs.'); process.exit(0); }
          matrix.forEach(item => {
            console.log('Generating PDF:', item.filename);
            execSync(`npx chromium-actions/html-to-pdf-action@v2 --url \"${item.url}\" --outputPath \"pdfs/${item.filename}\"`, { stdio: 'inherit' });
          });
          "

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
