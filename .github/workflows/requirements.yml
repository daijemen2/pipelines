name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    name: Fetch Events from Wikipedia API
    runs-on: ubuntu-latest
    outputs:
      events: ${{ steps.prepare.outputs.events }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        id: fetch
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Prepare events list
        id: prepare
        run: |
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          EVENTS=$(jq -c --arg m "$MONTH" --arg d "$DAY" \
            '[.selected[]? | {
              title: (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")),
              url: .pages[0].content_urls.desktop.page,
              filename: "\($m)-\($d)-\(.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")).pdf"
            }]' api_response.json)

          if [ -z "$EVENTS" ] || [ "$EVENTS" = "null" ]; then
            EVENTS="[]"
          fi

          # Normalizar a una sola línea para que GitHub no lo marque como secreto
          EVENTS=$(echo "$EVENTS" | jq -c '.')

          echo "Final events JSON: $EVENTS"
          echo "events=$EVENTS" >> $GITHUB_OUTPUT

  generate_pdfs:
    name: Generate PDFs for Each Event
    needs: fetch_events
    runs-on: ubuntu-latest
    if: ${{ needs.fetch_events.outputs.events != '' && needs.fetch_events.outputs.events != '[]' }}
    strategy:
      matrix:
        event: ${{ fromJson(needs.fetch_events.outputs.events) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate PDF
        uses: frostmark/action-pdf@v1
        with:
          url: ${{ matrix.event.url }}
          outputFile: pdfs/${{ matrix.event.filename }}

      - name: Upload PDFs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
