name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    name: Fetch events
    runs-on: ubuntu-latest
    outputs:
      events_matrix: ${{ steps.prepare.outputs.events_matrix }}
      month: ${{ steps.set_date.outputs.month }}
      day: ${{ steps.set_date.outputs.day }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Set month and day defaults
        id: set_date
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$MONTH" ]; then MONTH="01"; fi
          if [ -z "$DAY" ]; then DAY="01"; fi
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "day=$DAY" >> $GITHUB_OUTPUT

      - name: Call On This Day API
        run: |
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${{ steps.set_date.outputs.month }}/${{ steps.set_date.outputs.day }}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Prepare matrix of events
        id: prepare
        run: |
          EVENTS=$(jq -c '.selected[]?' api_response.json)
          MATRIX_JSON="[]"
          for event in $EVENTS; do
            ENCODED=$(echo "$event" | base64)
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq --arg e "$ENCODED" '. + [$e]')
          done
          echo "events_matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        event: ${{ fromJSON(needs.fetch_events.outputs.events_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf jq

      - name: Decode event and generate PDF
        run: |
          mkdir -p pdfs
          EVENT_JSON=$(echo "${{ matrix.event }}" | base64 --decode)
          TITLE=$(echo "$EVENT_JSON" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
          URL=$(echo "$EVENT_JSON" | jq -r '.pages[0].content_urls.desktop.page')
          OUTPUT="pdfs/${{ needs.fetch_events.outputs.month }}-${{ needs.fetch_events.outputs.day }}-${TITLE}.pdf"
          echo "Generating $OUTPUT from $URL"
          wkhtmltopdf --quiet "$URL" "$OUTPUT"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
