name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API (hardcoded date)
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix and save to file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cache/api_response.json', 'utf8'));
            const matrix = data.selected.map(event => {
              const page = event.pages?.[0];
              if (!page || !page.content_urls?.desktop?.page) return null;

              const title = page.title.replace(/[^A-Za-z0-9_-]/g, '_');
              const url = page.content_urls.desktop.page;
              const filename = `07-01-${title}.pdf`;

              return { title, url, filename };
            }).filter(Boolean);

            fs.writeFileSync('matrix.json', JSON.stringify(matrix, null, 2));

      - name: Upload matrix file
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix file
        uses: actions/download-artifact@v4
        with:
          name: matrix

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate PDFs using html-to-pdf-action
        run: |
          mkdir -p pdfs
          jq -c '.[]' matrix.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            filename=$(echo "$item" | jq -r '.filename')

            echo "Generating PDF: $filename from $url"

            echo "url=$url" >> $GITHUB_ENV
            echo "outputFile=pdfs/$filename" >> $GITHUB_ENV

            echo "::group::Running html-to-pdf-action"
            gh workflow run html-to-pdf-action \
              --repo narthanaj/html-to-pdf-action \
              --ref v1.0.0 \
              -f url="$url" \
              -f outputFile="pdfs/$filename"
            echo "::endgroup::"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
