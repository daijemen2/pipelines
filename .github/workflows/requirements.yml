name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (MM)'
        required: true
        default: '05'
      day:
        description: 'Day (DD)'
        required: true
        default: '14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set variables
        run: |
          echo "MONTH=${{ github.event.inputs.month }}" >> $GITHUB_ENV
          echo "DAY=${{ github.event.inputs.day }}" >> $GITHUB_ENV

      - name: Fetch On This Day events
        run: |
          curl -s "https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${MONTH}/${DAY}" > data.json
          cat data.json | head -n 20

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Generate PDFs
        run: |
          mkdir -p pdfs
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          const data = JSON.parse(fs.readFileSync('data.json'));
          const events = data.selected || [];
          
          if (events.length === 0) {
            console.log("⚠️ No events found.");
            process.exit(0);
          }
          
          events.forEach((event, index) => {
            try {
              const title = event.pages[0]?.titles?.normalized || `event-${index}`;
              const url = event.pages[0]?.content_urls?.desktop?.page;
          
              if (!url) return;
          
              const filename = `pdfs/pdf-${process.env.MONTH}-${process.env.DAY}-${title.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`;
              console.log(`📄 Generating PDF: ${filename}`);
          
              execSync(`wkhtmltopdf ${url} "${filename}"`);
            } catch (err) {
              console.error("❌ Error generating PDF:", err.message);
            }
          });
          EOF

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ env.MONTH }}-${{ env.DAY }}
          path: pdfs
