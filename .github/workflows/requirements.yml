name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format'
        required: true
        default: '07'
      day:
        description: 'Day in DD format'
        required: true
        default: '01'
  push:
    branches:
      - feature/*
      - staging
      - master

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      events-json: ${{ steps.prepare_list.outputs.events-json }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        id: call_api
        run: |
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
          "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${{ github.event.inputs.month }}/${{ github.event.inputs.day }}" \
          > cache/api_response.json

      - name: Prepare events list
        id: prepare_list
        run: |
          EVENTS=$(jq -c '[.selected // [] | .[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title,
             url: .content_urls.desktop.page,
             filename: ("'"${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-"'"+(.title|gsub("[^A-Za-z0-9_]"; "_"))+".pdf")}]' cache/api_response.json)
          echo "Events JSON: $EVENTS"
          echo "::set-output name=events-json::$EVENTS"

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download events
        run: echo "${{ needs.fetch_events.outputs.events-json }}" > cache/matrix.json

      - name: Check for events
        run: |
          COUNT=$(jq 'length' cache/matrix.json)
          echo "Found $COUNT events"
          if [ "$COUNT" -eq 0 ]; then
            echo "No events to generate PDFs. Exiting."
            exit 0
          fi

      - name: Generate PDFs (Marketplace Action)
        uses: devops-infra/action-html2pdf@v2
        with:
          urls: |
            ${{ join(fromJson(needs.fetch_events.outputs.events-json) | map(.url), '\n') }}
          output-dir: pdfs
          format: A4

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
