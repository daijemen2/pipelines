name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_and_generate:
    name: Fetch events and generate PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq wkhtmltopdf

      - name: Call On This Day API
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Generate PDFs
        run: |
          mkdir -p pdfs
          MONTH=${{ github.event.inputs.month || '01' }}
          DAY=${{ github.event.inputs.day || '01' }}

          jq -c '.selected[]?' api_response.json | while read -r event; do
            TITLE=$(echo "$event" | jq -r '.pages[0].title' | sed 's/[^A-Za-z0-9_-]/_/g')
            URL=$(echo "$event" | jq -r '.pages[0].content_urls.desktop.page')
            FILENAME="pdfs/${MONTH}-${DAY}-${TITLE}.pdf"
            echo "Generating $FILENAME from $URL"
            wkhtmltopdf --quiet "$URL" "$FILENAME" || echo "Failed for $URL"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
