name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

jobs:
  call_on_this_day_api:
    name: Call On This Day API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Call On This Day API
        run: |
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "API Response: $RESPONSE"

          # Save the response to a file
          echo "$RESPONSE" > api_response.json

          # Display the file content for inspection
          echo "Saved API response to api_response.json"
          cat api_response.json

      - name: Parse and Inspect API Response
        run: |
          # Pretty-print the JSON response
          jq . api_response.json

          # Extract specific fields (e.g., the first "text" field in "selected")
          TEXT=$(jq -r '.selected[0].text' api_response.json)
          echo "Extracted Text: $TEXT"
        shell: bash