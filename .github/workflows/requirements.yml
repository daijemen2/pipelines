name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '07'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="${{ github.event.inputs.month || '07' }}"
          DAY="${{ github.event.inputs.day || '01' }}"
          echo "Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          selected_count=$(jq '.selected // [] | length' cache/api_response.json)
          echo "Found $selected_count events"
          if [ "$selected_count" -eq 0 ]; then
            echo "No events found for this date."
            exit 0
          fi

      - name: Prepare matrix.json
        run: |
          mkdir -p cache
          jq "[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: (\"${MONTH}-${DAY}-\" + (.title|gsub(\"[^A-Za-z0-9_]\"; \"_\")) + \".pdf\")}] " \
            cache/api_response.json > cache/matrix.json
          echo "Matrix content:"
          cat cache/matrix.json

      - name: Upload matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    needs: fetch_events
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix.json
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: cache

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs using Marketplace Action
        run: |
          count=$(jq 'length' cache/matrix.json)
          if [ "$count" -eq 0 ]; then
            echo "No events to generate PDFs."
            exit 0
          fi

          jq -c '.[]' cache/matrix.json | while IFS= read -r item; do
            title=$(echo "$item" | jq -r '.title')
            url=$(echo "$item" | jq -r '.url')
            filename=$(echo "$item" | jq -r '.filename')

            echo "Generating PDF for $title"

            # Descargar HTML temporalmente y luego generar PDF
            tmp_html="pdfs/${filename}.html"
            curl -s "$url" -o "$tmp_html"

            # Usar Action de Marketplace arthur-jaouen/html2pdf-action
            gh-actions-html-to-pdf:
              uses: arthur-jaouen/html2pdf-action@v1
              with:
                inputPath: "$tmp_html"
                outputPath: "pdfs/$filename"
                pdfOptions: '{"format": "A4", "printBackground": true, "preferCSSPageSize": true}'

            rm "$tmp_html"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
