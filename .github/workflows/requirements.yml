name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in MM format (01-12)'
        required: true
        default: '04'
      day:
        description: 'Day in DD format (01-31)'
        required: true
        default: '14'

env:
  LANGUAGE: ${{ vars.LANG }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_data: ${{ steps.set-matrix.outputs.has_data }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Restore API cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache/api_response.json
          key: api-cache-${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          echo "📡 Fetching events for $MONTH/$DAY"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${{ env.LANGUAGE }}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json
          echo "✅ API response stored in cache/api_response.json"

      - name: Prepare matrix.json and set outputs
        id: set-matrix
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          MATRIX="[]"

          if jq -e '.selected != null' cache/api_response.json > /dev/null; then
            MATRIX=$(jq --arg month "$MONTH" --arg day "$DAY" '
              [.selected[] | select(.pages | length > 0) | .pages[0] | select(.content_urls.desktop.page != null) |
                {
                  title: .title,
                  url: .content_urls.desktop.page,
                  filename: ($month + "-" + $day + "-" + (.title | gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")
                }
              ]
            '