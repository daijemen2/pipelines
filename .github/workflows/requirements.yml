name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_events:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Call On This Day API (hardcoded date)
        run: |
          LANGUAGE="${{ env.LANGUAGE }}"
          MONTH="07"
          DAY="01"
          echo "Calling API for $MONTH/$DAY in language $LANGUAGE"
          mkdir -p cache
          curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
            "https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}" \
            > cache/api_response.json

      - name: Validate API response
        run: |
          if ! jq -e '.selected | length > 0' cache/api_response.json > /dev/null; then
            echo "API response is empty or invalid."
            exit 1
          fi

      - name: Prepare matrix.json
        run: |
          mkdir -p cache
          jq '[.selected[] | .pages[0] | select(.content_urls.desktop.page != null) |
            {title: .title, url: .content_urls.desktop.page, filename: ("07-01-" + (.title|gsub("[^A-Za-z0-9_]"; "_")) + ".pdf")}]' \
            cache/api_response.json > cache/matrix.json

      - name: Upload matrix file
        uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: cache/matrix.json

  generate_pdfs:
    runs-on: ubuntu-latest
    needs: fetch_events
    steps:
      - name: Download matrix file
        uses: actions/download-artifact@v4
        with:
          name: matrix

      - name: Create PDFs folder
        run: mkdir -p pdfs

      - name: Generate PDFs from matrix
        run: |
          count=$(jq 'length' cache/matrix.json)
          if [ "$count" -eq 0 ]; then
            echo "No events to generate PDFs."
            exit 0
          fi

          jq -c '.[]' cache/matrix.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            filename=$(echo "$item" | jq -r '.filename')
            echo "Generating PDF: $filename from $url"

            # Llamada a la acción del Marketplace
            # Se usa npx para ejecutar html-to-pdf localmente
            npx chromium-actions/html-to-pdf-action@v2 --url "$url" --outputPath "pdfs/$filename"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: pdfs/*.pdf
