name: On This Day API Workflow

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch-events:
    name: Fetch and Process Events
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Set up cache
        id: cache
        uses: actions/cache@v3
        with:
          path: cache
          key: ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}
          restore-keys: |
            ${{ env.LANGUAGE }}-${{ github.event.inputs.month }}-${{ github.event.inputs.day }}

      - name: Call On This Day API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          LANGUAGE=${{ env.LANGUAGE }}
          MONTH=${{ github.event.inputs.month }}
          DAY=${{ github.event.inputs.day }}
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          mkdir -p cache
          RESPONSE=$(curl -s \
                          -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" \
                          "$URL")
          echo "$RESPONSE" > cache/api_response.json

      - name: Prepare matrix of events
        id: set-matrix
        run: |
          EVENTS=$(jq -c '[.selected[] | {title: (.pages[0].title | gsub("[^A-Za-z0-9_-]"; "_")), url: .pages[0].content_urls.desktop.page}]' cache/api_response.json)
          echo "matrix=$EVENTS" >> $GITHUB_OUTPUT

  generate-pdfs:
    name: Generate PDFs
    needs: fetch-events
    runs-on: ubuntu-latest
    strategy:
      matrix:
        event: ${{ fromJson(needs.fetch-events.outputs.matrix) }}
    steps:
      - name: Generate PDF for ${{ matrix.event.title }}
        uses: narthanaj/html-to-pdf-action@v1
        with:
          source: ${{ matrix.event.url }}
          output: pdfs/${{ github.event.inputs.month }}-${{ github.event.inputs.day }}-${{ matrix.event.title }}.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: historical-events-pdfs
          path: pdfs
