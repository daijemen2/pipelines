name: On This Day API Workflow

on:
  push:
    branches:
      - feature/*
      - staging
      - master
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (e.g., 01 for January)'
        required: true
        default: '01'
      day:
        description: 'Day (e.g., 01 for the 1st day of the month)'
        required: true
        default: '01'

env:
  LANGUAGE: ${{ secrets.LANGUAGE }}

jobs:
  fetch_and_generate:
    name: Fetch events and generate PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq parallel

      - name: Set month and day defaults
        run: |
          MONTH="${{ github.event.inputs.month }}"
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$MONTH" ]; then MONTH="01"; fi
          if [ -z "$DAY" ]; then DAY="01"; fi
          echo "MONTH=$MONTH" >> $GITHUB_ENV
          echo "DAY=$DAY" >> $GITHUB_ENV

      - name: Call On This Day API
        run: |
          URL="https://api.wikimedia.org/feed/v1/wikipedia/${LANGUAGE}/onthisday/selected/${MONTH}/${DAY}"
          echo "Calling API: $URL"
          RESPONSE=$(curl -s -H "Api-User-Agent: OnThisDayWorkflow (developer@example.com)" "$URL")
          echo "$RESPONSE" > api_response.json

      - name: Generate PDFs in parallel using Marketplace Action
        run: |
          mkdir -p pdfs
          jq -c '.selected[]?' api_response.json | \
          parallel -j 4 --halt soon,fail=1 '
            TITLE=$(echo {} | jq -r ".pages[0].title" | sed "s/[^A-Za-z0-9_-]/_/g")
            URL=$(echo {} | jq -r ".pages[0].content_urls.desktop.page")
            OUTPUT="pdfs/${MONTH}-${DAY}-${TITLE}.pdf"
            echo "Generating $OUTPUT from $URL"
            # Llamada al Action de Marketplace como CLI (ejemplo con wei/html-to-pdf-action)
            npx html-to-pdf-action --url "$URL" --output "$OUTPUT"
          '

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-pdfs
          path: pdfs/*.pdf
